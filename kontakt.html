      href="https://cdn.jsdelivr.net/gh/freeps2/a7rarpress@main/swiper-bundle.min.css"
    />
    <title>Kontakt</title>
  </head>
  <body>
    <header>
      <div class="logoimg">
        <img src="slike/icon.png" alt="" />
      </div>
      <div class="logo-image">
        <img
          src="slike/Gemini_Generated_Image_ft3brkft3brkft3b-removebg-preview.png"
          alt="logo"
        />
      </div>
      <div class="logo-image-black">
        <img src="slike/logo-white.png" alt="logo" />
      </div>
      <nav id="menu">
        <a href="index.html">Početna</a>
        <a href="materijali.html">Materijali</a>
        <a href="savjeti.html">Savjeti</a>
        <a href="kontakt.html" class="active">Kontakt</a>
        <button class="theme"><i class="fa-solid fa-moon"></i></button>
        <a href="#"><button class="gitrepo">Git</button></a>
      </nav>
      <div class="hamburger" onclick="toggleMenu()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </header>
    <div class="contact-container">
      <div class="contact-box">
        <h2>Imate pitanje? Kontaktirajte nas!</h2>
        <form action="#" method="post">
          <label for="ime">Ime:</label>
          <input
            type="text"
            id="ime"
            name="ime"
            class="field"
            placeholder="Vaše ime"
            required
          />
          <label for="prezime">Prezime:</label>
          <input
            type="text"
            id="prezime"
            name="prezime"
            class="field"
            placeholder="Vaše prezime"
            required
          />
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            class="field"
            placeholder="Vaš email"
            required
          />
          <label for="telefon">Broj telefona:</label>
          <input
            type="text"
            id="telefon"
            name="telefon"
            class="field"
            placeholder="Vaš broj telefona"
          />
          <label for="problem">Problem:</label>
          <select id="problem" class="field" name="problem" required>
            <option value="">Izaberi</option>
            <option value="Ispiti i rokovi">Ispiti i rokovi</option>
            <option value="Zadaće i projekti">Zadaće i projekti</option>
            <option value="Materijali">Materijali</option>
            <option value="Upis i administracija">Upis i administracija</option>
            <option value="Ostalo">Ostalo</option>
          </select>
          <label for="poruka">Poruka:</label>
          <textarea
            id="poruka"
            name="poruka"
            class="field"
            placeholder="Opišite problem ili pitanje"
            required
          ></textarea>
          <button type="submit" class="btn">Pošalji</button>
        </form>
      </div>
    </div>
    <footer id="footer">
      <div class="upper">
        <div class="authors">
          <h3>Autori</h3>
          <div class="author">
            <div class="icon"><i class="fa-solid fa-user-gear"></i></div>
            <p>Aida Halilčević</p>
          </div>
          <div class="author">
            <div class="icon"><i class="fa-solid fa-user-gear"></i></div>
            <p>Ahmed Mahmutović</p>
          </div>
          <div class="author">
            <div class="icon"><i class="fa-solid fa-user-gear"></i></div>
            <p>Ahmed Selimbašić</p>
          </div>
        </div>
        <div class="contact">
          <h3>Kontakt</h3>
          <div class="mail">
            <div class="icon"><i class="fa-solid fa-envelope"></i></div>
            <p>aida.halilcevic@fet.ba</p>
          </div>
          <div class="mail">
            <div class="icon"><i class="fa-solid fa-envelope"></i></div>
            <p>ahmed.mahmutovic@fet.ba</p>
          </div>
          <div class="mail">
            <div class="icon"><i class="fa-solid fa-envelope"></i></div>
            <p>ahmed.selimbasic@fet.ba</p>
          </div>
        </div>
        <div class="meni">
          <h3>Meni</h3>
          <a href="index.html">Početna</a>
          <a href="materijali.html">Materijali</a>
          <a href="savjeti">Savjeti</a>
          <a href="kontakt.html" class="active">Kontakt</a>
        </div>
      </div>
      <div class="lower">&copy;FETHub 2026</div>
