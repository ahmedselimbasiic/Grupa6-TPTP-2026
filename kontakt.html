  <body>
    <header>
      <div class="logoimg">
        <img src="slike/icon.png" alt="" />

      <div class="logo-image">

    </header>
    <div class="container">
      <div class="contact-box">
        <div class="right">
          <h2>Imate pitanje? Kontaktirajte nas!</h2>
          <input type="text" class="field" placeholder="Vaše ime" />
          <input type="text" class="field" placeholder="Vaše prezime" />
          <input type="email" class="field" placeholder="Vaš email" />
          <input type="text" class="field" placeholder="Vaš broj telefona" />

          <label for="problem">Problem:</label>
          <select class="field" name="problem">
            <option value="">Izaberi</option>
            <option value="Ispiti i rokovi">Ispiti i rokovi</option>
            <option value="Zadaće i projekti">Zadaće i projekti</option>
            <option value="Materijali">Materijali</option>
            <option value="Upis i administracija">Upis i administracija</option>
            <option value="Ostalo">Ostalo</option>
          </select>
          <textarea
            class="field"
            placeholder="Opišite problem ili pitanje"
          ></textarea>
        </div>
      </div>
    </div>
    <footer>
      <div class="upper">
        <div class="authors">
          <div class="author">
            <div class="icon"></div>
            <p>Aida Halilčević</p>
          </div>
          <div class="author">

          </div>

        <div class="contact">

          </div>
          <div class="mail">
            <div class="icon"></div>
            <p>ahmed.mahmutovic@fet.ba</p>
          </div>
          <div class="mail">
            <div class="icon"></div>
            <p>ahmed.selimbasic@fet.ba</p>
          </div>

        <div class="meni">

        </div>
